function sortData(arr, field, dir){
  if(!arr || !arr.length) return arr;
  return arr.slice().sort((a,b) => {
    let va = a[field] ?? '';
    let vb = b[field] ?? '';
    if(typeof va === 'number' && typeof vb === 'number'){
      return dir === 'asc' ? va - vb : vb - va;
    }
    va = String(va).toLowerCase();
    vb = String(vb).toLowerCase();
    if(!va && !vb) return 0;
    if(!va) return 1;
    if(!vb) return -1;
    return dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
  });
}

  if(!db) return;

async function pushToCloud(){
  if(!syncEnabled || !supabaseClient || syncInProgress) return false;
  try{
    syncInProgress = true;
    touchLocal(); // vaxtı yenilə

    const { error } = await supabaseClient
      .from('biznespro_data')
      .update({ 
        data: db, 
        updated_at: new Date().toISOString()

      .eq('id', SYNC_ROW_ID);

    if(error){
      console.warn('Buluda yazma xətası:', error.message);
      updateSyncIndicator('⚠ Yazma xətası', true);
      return false;
    } else {
      lastCloudUpdate = Date.now();
      updateSyncIndicator('✓ Sinxron');
      return true;
    }
  } catch(e){
    console.warn('Sync xətası:', e);
    updateSyncIndicator('⚠ Xəta', true);
    return false;
  } finally {
    syncInProgress = false;
  }

function renderDashboardCharts(){

  }
  const salesData=months.map(mm=>sum(db.invoices.filter(i=>{
    const d=new Date(i.date);
    return i.type==='sale'&&d.getFullYear()===mm.y&&d.getMonth()+1===mm.m;
  }),invTotal));
  const buyData=months.map(mm=>sum(db.invoices.filter(i=>{

    return i.type==='purchase'&&d.getFullYear()===mm.y&&d.getMonth()+1===mm.m;

  if(charts.sales) charts.sales.destroy();

  if(c1){
    charts.sales=new Chart(c1,{type:'line',data:{
      labels:months.map(x=>x.label),
      datasets:[
        {label:'Satış',data:salesData,borderColor:'#1769aa',backgroundColor:'#1769aa22',tension:.3,fill:true},
        {label:'Alış',data:buyData,borderColor:'#c53030',backgroundColor:'#c5303022',tension:.3,fill:true}
      ]
    },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
  }

  const prodSales={};
  db.invoices.filter(i=>i.type==='sale').forEach(i=>(i.items||[]).forEach(x=>{
    prodSales[x.productId]=(prodSales[x.productId]||0)+x.qty*x.price-(x.discount||0);
  }));
  const top=Object.entries(prodSales).map(([pid,val])=>({p:db.products.find(z=>z.id===pid),val})).filter(x=>x.p).sort((a,b)=>b.val-a.val).slice(0,5);

  if(charts.top) charts.top.destroy();
  const c2=document.getElementById('chartTop');
  if(c2){
    charts.top=new Chart(c2,{type:'bar',data:{
      labels:top.map(x=>x.p.name.slice(0,20)),
      datasets:[{label:'Satış məbləği',data:top.map(x=>x.val),backgroundColor:'#16834b'}]
    },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},indexAxis:'y'}});
  }
}

function productTable(arr){

  arr = sortData(arr, s.field, s.dir);
  const sortCls = (f) => 'sortable ' + (s.field===f ? ('sort-' + (s.dir==='asc'?'asc':'desc')) : '');
  
  let html='<div class="tablewrap"><table class="table"><thead><tr>'+
    '<th style="width:50px;text-align:center">#</th>'+
    '<th class="'+sortCls('code')+'" onclick="setSort(\'products\',\'code\')">Kod</th>'+
    '<th class="'+sortCls('name')+'" onclick="setSort(\'products\',\'name\')">Məhsul</th>'+

    '<th>Vahid</th>'+
    '<th class="'+sortCls('initial')+'" onclick="setSort(\'products\',\'initial\')">Baş. stok</th>'+
    '<th>Qalıq</th>'+
    '<th class="'+sortCls('maya')+'" onclick="setSort(\'products\',\'maya\')">Maya</th>'+
    '<th class="'+sortCls('cost')+'" onclick="setSort(\'products\',\'cost\')">Alış</th>'+
    '<th class="'+sortCls('price')+'" onclick="setSort(\'products\',\'price\')">Satış</th>'+
    '<th>Marja</th>'+
    '<th>Maya dəyəri</th>'+
    '<th>Alış dəyəri</th>'+
    '<th>Satış dəyəri</th>'+
    '<th class="'+sortCls('verilmeTarixi')+'" onclick="setSort(\'products\',\'verilmeTarixi\')">Verilmə tarixi</th>'+
    '<th>Əməliyyat</th>'+
  '</tr></thead><tbody>';
  
  if(!arr||!arr.length){
    html+='<tr><td colspan="16">Məlumat yoxdur</td></tr></tbody></table></div>';
    return html;
  }
  
  let tInit=0,tStock=0,tMaya=0,tBuy=0,tSale=0;
  arr.forEach((p, idx)=>{
    const st=stock(p);
    const maya=costOf(p);
    const cost=Number(p.cost||0);
    const price=Number(p.price||0);
    const margin=price>0?((price-cost)/price*100):0;
    tInit+=Number(p.initial||0);tStock+=st;tMaya+=st*maya;tBuy+=st*cost;tSale+=st*price;
    html+='<tr>'+
      '<td style="text-align:center;font-weight:700;color:#667085">'+(idx+1)+'</td>'+
      '<td>'+esc(p.code)+'</td>'+
      '<td>'+esc(p.name)+'</td>'+
      '<td>'+esc(p.növ||p.nov||'')+'</td>'+
      '<td>'+esc(p.unit)+'</td>'+
      '<td>'+Number(p.initial||0)+'</td>'+
      '<td><span class="badge '+(st<=Number(p.min||0)?'bad':'ok')+'">'+st+'</span></td>'+
      '<td>'+money(maya)+'</td>'+
      '<td>'+money(cost)+'</td>'+
      '<td>'+money(price)+'</td>'+
      '<td><span class="'+(margin>=20?'green':(margin>=0?'yellow':'red'))+'">'+margin.toFixed(1)+'%</span></td>'+
      '<td>'+money(st*maya)+'</td>'+
      '<td>'+money(st*cost)+'</td>'+
      '<td>'+money(st*price)+'</td>'+
      '<td>'+esc(p.verilmeTarixi||'')+'</td>'+
      '<td><button class="light" onclick="productForm(\''+p.id+'\')">Düzəlt</button> <button class="danger" onclick="deleteProduct(\''+p.id+'\')">Sil</button></td>'+
    '</tr>';
  });
  
  html+='<tr style="font-weight:700;background:#f0f4f8"><td colspan="5">YEKUN</td><td>'+tInit+'</td><td>'+tStock+'</td><td></td><td></td><td></td><td></td><td>'+money(tMaya)+'</td><td>'+money(tBuy)+'</td><td>'+money(tSale)+'</td><td colspan="2"></td></tr>';
  html+='</tbody></table></div>';
  return html;
}

function deleteProduct(id){
  const p=db.products.find(x=>x.id===id); if(!p)return;
  const usedInv=db.invoices.filter(i=>(i.items||[]).some(x=>x.productId===id)).length;
  const msg=usedInv?`"${p.name}" məhsulu ${usedInv} qaimədə istifadə olunub.\nSilinsə, həmin qaimələrdə ad görünməyəcək.\n\nƏminsiniz?`:`"${p.name}" silinsin?`;
  if(!confirm(msg))return;
  db.products=db.products.filter(x=>x.id!==id);save();
}

function addReturnRow(type,item=null){
  const host=document.getElementById('returnItems');
  const row=document.createElement('div');row.className='formgrid';row.style.marginBottom='8px';
  const prodOpt=db.products.map(p=>`<option value="${p.id}">${esc(p.code)} — ${esc(p.name)}</option>`).join('');
  row.innerHTML=`
    <div class="field wide"><label>Məhsul</label><select class="rr-product"><option value="">Seçin</option>${prodOpt}</select></div>
    <div class="field"><label>Miqdar</label><input class="rr-qty" type="number" step=".001" value="${item?.qty||1}"></div>
    <div class="field"><label>Alış qiyməti</label><input class="rr-price" type="number" step=".01" value="${item?.price||0}"></div>
    <div class="field"><label>Satış qiyməti</label><input class="rr-sale-price" type="number" step=".01" value="0"></div>
    <input type="hidden" class="rr-pid" value="${item?.productId||''}">
  `;
  host.appendChild(row);
  const sel=row.querySelector('.rr-product');
  if(item?.productId) sel.value=item.productId;
  sel.onchange=()=>{
    const p=db.products.find(x=>x.id===sel.value);
    if(p){
      row.querySelector('.rr-price').value = p.alis || p.cost || 0;
      row.querySelector('.rr-sale-price').value = p.price || 0;
      row.querySelector('.rr-pid').value=p.id;
    }
  };
  if(item?.productId){
    const p=db.products.find(x=>x.id===item.productId);
    if(p){
      row.querySelector('.rr-price').value = item.price || p.alis || p.cost || 0;
      row.querySelector('.rr-sale-price').value = p.price || 0;
    }
  }
}
function saveReturn(type){
  const party=document.getElementById('rparty').value;
  const reason=document.getElementById('rreason').value.trim();
  const rows=[...document.querySelectorAll('#returnItems .formgrid')];
  const items=[];
  rows.forEach(r=>{
    const pid=r.querySelector('.rr-product').value;
    const qty=+r.querySelector('.rr-qty').value||0;
    const alisPrice=+r.querySelector('.rr-price').value||0;
    const salePrice=+r.querySelector('.rr-sale-price')?.value||0;
    const price = type==='purchase' ? alisPrice : salePrice;
    if(pid&&qty>0) items.push({productId:pid,qty,alisPrice,salePrice,price,total:qty*price});
  });
  if(!items.length){toast('Ən azı bir sətir','bad');return;}
  const p=(type==='sale'?db.customers:db.suppliers).find(x=>x.id===party);
  const total=items.reduce((s,x)=>s+x.total,0);
  const ret={id:uid(),no:document.getElementById('rno').value,date:document.getElementById('rdate').value,type,partyId:party,partyName:p?.name||'',reason,items,total};
  db.returns.push(ret);
  const sign = type==='sale' ? 1 : -1;
  items.forEach(it=>{
    logStock(it.productId,sign*it.qty,'return',ret.id,ret.no);
  });
  closeModal();save();toast('Qaytarma yadda saxlanıldı');
}
function deleteReturn(id){
  if(!confirm('Qaytarma silinsin? Stok əksinə düzəldiləcək.'))return;
  const r=db.returns.find(x=>x.id===id);if(!r)return;
  const sign = r.type==='sale' ? -1 : 1;
  (r.items||[]).forEach(it=>logStock(it.productId,sign*it.qty,'return-delete',r.id,r.no));
  db.returns=db.returns.filter(x=>x.id!==id);save();toast('Silindi');
}

function monthReportData(v){
 let [y,m]=v.split('-').map(Number);
 const mStart=new Date(y,m-1,1),mEnd=new Date(y,m,1);
 const inMonth=i=>{let d=new Date(i.date);return d>=mStart&&d<mEnd};
 const before=i=>new Date(i.date)<mStart;
 const result=db.products.map(p=>{
   let opening=Number(p.initial||0),purchases=0,sales=0,salesAmount=0,purchaseAmount=0,returns=0,returnsAmount=0;
   const maya=costOf(p);
   db.invoices.forEach(i=>(i.items||[]).forEach(x=>{
     if(x.productId!==p.id)return;
     const q=Number(x.qty||0);
     if(before(i)) opening+=i.type==='purchase'?q:-q;
     else if(inMonth(i)){
       if(i.type==='purchase'){purchases+=q;purchaseAmount+=q*Number(x.alis||x.price||0);}
       else {sales+=q;salesAmount+=q*Number(x.salePrice||x.price||0);}
     }
   }));
   (db.returns||[]).forEach(r=>{
     if(!inMonth(r))return;
     (r.items||[]).forEach(x=>{
       if(x.productId!==p.id)return;
       const q=Number(x.qty||0);
       if(r.type==='sale'){returns+=q;returnsAmount+=q*Number(x.price||0);}
       else{purchases-=q;purchaseAmount-=q*Number(x.price||0);}
     });
   });
   const closing=opening+purchases-sales+returns;
   return {p,opening,purchases,sales,returns,closing,salesAmount,returnsAmount,purchaseAmount,stockValue:closing*maya};
 });
 return {y,m,result};
}
function renderReport(){
 let v=document.getElementById('reportMonth')?.value;if(!v)return;
 const {y,m,result}=monthReportData(v);
 const sales=sum(db.invoices.filter(i=>i.type==='sale'&&(()=>{let d=new Date(i.date);return d.getFullYear()===y&&d.getMonth()+1===m})()),invTotal);
 const buys=sum(db.invoices.filter(i=>i.type==='purchase'&&(()=>{let d=new Date(i.date);return d.getFullYear()===y&&d.getMonth()+1===m})()),invTotal);
 const ex=sum(db.expenses.filter(i=>{let d=new Date(i.date);return d.getFullYear()===y&&d.getMonth()+1===m}),x=>x.amount);
 const soldQty=sum(result,x=>x.sales);
 const closingQty=sum(result,x=>x.closing);
 const closingValue=sum(result,x=>x.stockValue);
 const openingQty=sum(result,x=>x.opening);
 const purchaseQty=sum(result,x=>x.purchases);
 const rows=result.filter(x=>x.opening!==0||x.purchases!==0||x.sales!==0||x.closing!==0||x.salesAmount!==0);
 document.getElementById('reportBox').innerHTML=`
 <div class="grid">
   <div class="card metric"><div class="label">Satış</div><div class="num">${money(sales)}</div></div>
   <div class="card metric"><div class="label">Satılan miqdar</div><div class="num">${soldQty}</div></div>
   <div class="card metric"><div class="label">Ay sonu qalıq</div><div class="num">${closingQty}</div></div>
   <div class="card metric"><div class="label">Qalıq dəyəri</div><div class="num">${money(closingValue)}</div></div>
 </div>
 <div class="grid">
   <div class="card metric"><div class="label">Ay əvvəli</div><div class="num">${openingQty}</div></div>
   <div class="card metric"><div class="label">Alış</div><div class="num">${purchaseQty}</div></div>
   <div class="card metric"><div class="label">Alış məbləği</div><div class="num">${money(buys)}</div></div>
   <div class="card metric"><div class="label">Xərclər</div><div class="num">${money(ex)}</div></div>
 </div>
 <h2>📊 ${String(m).padStart(2,'0')}/${y}</h2>
 <div class="tablewrap"><table class="table"><thead><tr>
   <th>Kod</th><th>Məhsul</th><th>Vahid</th><th>Ay əvvəli</th><th>Alış</th><th>Satış</th><th>Qaytarma</th><th>Ay sonu</th><th>Satış məbləği</th><th>Qalıq dəyəri</th>
 </tr></thead><tbody>
 ${rows.map(x=>`<tr>
   <td>${esc(x.p.code)}</td><td>${esc(x.p.name)}</td><td>${esc(x.p.unit)}</td>
   <td>${x.opening}</td><td>${x.purchases}</td><td>${x.sales}</td><td>${x.returns}</td>
   <td><span class="badge ${x.closing<=Number(x.p.min||0)?'bad':'ok'}">${x.closing}</span></td>
   <td>${money(x.salesAmount)}</td><td>${money(x.stockValue)}</td>
 </tr>`).join('')||'<tr><td colspan="10">Yoxdur</td></tr>'}
 <tr style="font-weight:700"><td colspan="3">CƏM</td><td>${openingQty}</td><td>${purchaseQty}</td><td>${soldQty}</td><td>-</td><td>${closingQty}</td><td>${money(sum(result,x=>x.salesAmount))}</td><td>${money(closingValue)}</td></tr>
 </tbody></table></div>`;
}

function profit(){
  const sales=db.invoices.filter(i=>i.type==='sale');
  let totalSales=0,totalCogs=0,totalExpense=expenseValue(),totalReturns=returnValue();
  const byProduct={};
  sales.forEach(inv=>{
    totalSales+=invTotal(inv);
    (inv.items||[]).forEach(x=>{
      const p=db.products.find(z=>z.id===x.productId);
      const cogs=x.qty*(p?costOf(p):0);
      totalCogs+=cogs;
      const key=x.productId;
      if(!byProduct[key]) byProduct[key]={p,qty:0,sales:0,cogs:0};
      byProduct[key].qty+=x.qty;
      byProduct[key].sales+=x.qty*x.price-(x.discount||0);
      byProduct[key].cogs+=cogs;
    });
  });
  const realProfit=totalSales-totalCogs-totalExpense-totalReturns;
  const marginPct=totalSales>0?(realProfit/totalSales*100):0;
  const arr=Object.values(byProduct).sort((a,b)=>(b.sales-b.cogs)-(a.sales-a.cogs));
  return `<div class="grid">
    <div class="card metric"><div class="label">Ümumi satış</div><div class="num">${money(totalSales)}</div></div>
    <div class="card metric"><div class="label">Maya dəyəri (COGS)</div><div class="num red">${money(totalCogs)}</div></div>
    <div class="card metric"><div class="label">Brüt mənfəət</div><div class="num">${money(totalSales-totalCogs)}</div></div>
    <div class="card metric"><div class="label">Xərclər + Qaytarma</div><div class="num red">${money(totalExpense+totalReturns)}</div></div>
    <div class="card metric"><div class="label">Real mənfəət</div><div class="num ${realProfit>=0?'green':'red'}">${money(realProfit)}</div></div>
  </div>
  <div class="grid-2" style="margin-top:14px">
    <div class="panel"><h3>Mənfəət bölgüsü</h3><div class="chart-wrap"><canvas id="chartProfit"></canvas></div></div>
    <div class="panel"><h3>Marja faizi</h3><div style="text-align:center;padding:30px"><div style="font-size:60px;font-weight:900;color:${marginPct>=0?'#16834b':'#c53030'}">${marginPct.toFixed(1)}%</div><p class="muted">Ümumi marja</p></div></div>
  </div>
  <div class="panel"><h2>Məhsul üzrə mənfəət</h2>
  <div class="tablewrap"><table class="table"><thead><tr>
    <th>Kod</th><th>Məhsul</th><th>Satılan</th><th>Satış</th><th>Maya</th><th>Mənfəət</th><th>Marja %</th>
  </tr></thead><tbody>
  ${arr.map(x=>{
    const profit=x.sales-x.cogs;
    const pct=x.sales>0?(profit/x.sales*100):0;
    return `<tr>
      <td>${esc(x.p?.code||'')}</td><td>${esc(x.p?.name||'(silinmiş)')}</td>
      <td>${x.qty}</td><td>${money(x.sales)}</td><td>${money(x.cogs)}</td>
      <td class="${profit>=0?'green':'red'}">${money(profit)}</td>
      <td><span class="badge ${pct>=20?'ok':(pct>=0?'warn':'bad')}">${pct.toFixed(1)}%</span></td>
    </tr>`;
  }).join('')||'<tr><td colspan="7">Yoxdur</td></tr>'}
  </tbody></table></div></div>`;
}
function renderProfitCharts(){
  if(typeof Chart==='undefined')return;
  const sales=db.invoices.filter(i=>i.type==='sale');
  let totalSales=0,totalCogs=0;
  sales.forEach(inv=>{totalSales+=invTotal(inv);(inv.items||[]).forEach(x=>{const p=db.products.find(z=>z.id===x.productId);totalCogs+=x.qty*(p?costOf(p):0);});});
  const exp=expenseValue(),ret=returnValue();
  if(charts.profit) charts.profit.destroy();
  const c=document.getElementById('chartProfit');
  if(c){
    charts.profit=new Chart(c,{type:'doughnut',data:{
      labels:['Maya dəyəri','Xərclər','Qaytarma','Real mənfəət'],
      datasets:[{data:[totalCogs,exp,ret,Math.max(0,totalSales-totalCogs-exp-ret)],backgroundColor:['#c53030','#b7791f','#667085','#16834b']}]
    },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
  }
}

/* ============ ACTUAL SALES ============ */
function totalAvailable(p){
 let q=Number(p.initial||0);
 db.invoices.forEach(i=>(i.items||[]).forEach(x=>{if(x.productId===p.id&&i.type==='purchase')q+=Number(x.qty||0)}));
 (db.returns||[]).forEach(r=>{
   (r.items||[]).forEach(x=>{
     if(x.productId!==p.id)return;
     if(r.type==='sale') q+=Number(x.qty||0);
     else q-=Number(x.qty||0);
   });
 });
 return q;
}
function recordedSalesQty(p){
 return sum(db.invoices.filter(i=>i.type==='sale'),i=>sum(i.items||[],x=>x.productId===p.id?x.qty:0));
}
function actualsales(){
 let rows=db.products.map(p=>{
   const available=totalAvailable(p);
   const actual=db.actualStock[p.id]===undefined?'':Number(db.actualStock[p.id]||0);
   const sold=actual===''?null:available-actual;
   const recorded=recordedSalesQty(p);
   const diff=sold===null?null:sold-recorded;
   const maya=costOf(p);
   return {p,available,actual,sold,recorded,diff,saleAmount:sold===null?0:sold*Number(p.price||0),mayaAmount:sold===null?0:sold*maya,costAmount:sold===null?0:sold*Number(p.cost||0)};
 });
 return `<div class="panel"><div class="toolbar">
    <button class="success" onclick="saveActualStocks()">💾 Yadda saxla</button>
    <button class="light" onclick="clearActualStocks()">🧹 Təmizlə</button>
    <button class="light" onclick="exportActualSalesCSV()">📄 CSV</button>
    <button class="light" onclick="printActualSales()">🖨 Çap</button>
   </div>
   <div class="grid">
    <div class="card metric"><div class="label">Ümumi mövcud</div><div class="num">${sum(rows,x=>x.available)}</div></div>
    <div class="card metric"><div class="label">Faktiki qalıq</div><div class="num">${sum(rows,x=>x.actual===''?0:x.actual)}</div></div>
    <div class="card metric"><div class="label">Hesablanan satış</div><div class="num green">${sum(rows,x=>x.sold===null?0:x.sold)}</div></div>
    <div class="card metric"><div class="label">Qaimə satış</div><div class="num">${sum(rows,x=>x.recorded)}</div></div>
    <div class="card metric"><div class="label">Satış məbləği</div><div class="num">${money(sum(rows,x=>x.saleAmount))}</div></div>
    <div class="card metric"><div class="label">Maya məbləği</div><div class="num">${money(sum(rows,x=>x.mayaAmount))}</div></div>
    <div class="card metric"><div class="label">Alış məbləği</div><div class="num">${money(sum(rows,x=>x.costAmount))}</div></div>
   </div>
   <div class="tablewrap" style="margin-top:12px"><table class="table"><thead><tr>
    <th>Kod</th><th>Məhsul</th><th>Vahid</th><th>Ümumi</th><th>Faktiki</th><th>Hesablanan</th><th>Qaimə</th><th>Fərq</th><th>Satış məbl.</th><th>Maya məbl.</th><th>Alış məbl.</th>
   </tr></thead><tbody>
   ${rows.map(x=>`<tr>
    <td>${esc(x.p.code)}</td><td>${esc(x.p.name)}</td><td>${esc(x.p.unit)}</td><td>${x.available}</td>
    <td><input class="actual-stock-input" data-id="${x.p.id}" type="number" step=".001" min="0" value="${x.actual===''?'':x.actual}" placeholder="Qalıq"></td>
    <td>${x.sold===null?'—':x.sold}</td><td>${x.recorded}</td>
    <td>${x.diff===null?'—':`<span class="badge ${Math.abs(x.diff)<0.0001?'ok':'bad'}">${x.diff}</span>`}</td>
    <td>${x.sold===null?'—':money(x.saleAmount)}</td>
    <td>${x.sold===null?'—':money(x.mayaAmount)}</td>
    <td>${x.sold===null?'—':money(x.costAmount)}</td>
   </tr>`).join('')||'<tr><td colspan="11">Yoxdur</td></tr>'}
   </tbody></table></div>
 </div>`;
}
function saveActualStocks(){
 document.querySelectorAll('.actual-stock-input').forEach(el=>{
   const v=el.value.trim();
   if(v==='') delete db.actualStock[el.dataset.id];
   else db.actualStock[el.dataset.id]=Number(v)||0;

function exportActualSalesCSV(){
 const rows=[['Kod','Məhsul','Vahid','Ümumi','Faktiki','Hesablanan','Qaimə','Fərq','Satış məbl.','Maya məbl.','Alış məbl.']];
 db.products.forEach(p=>{
  const available=totalAvailable(p),actual=db.actualStock[p.id]===undefined?'':Number(db.actualStock[p.id]||0),sold=actual===''?'':available-actual,recorded=recordedSalesQty(p),diff=sold===''?'':sold-recorded;
  const maya=costOf(p);
  rows.push([p.code,p.name,p.unit,available,actual,sold,recorded,diff,sold===''?'':sold*Number(p.price||0),sold===''?'':sold*maya,sold===''?'':sold*Number(p.cost||0)]);
 });
 const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Faktiki_Satis.csv';a.click();
}
function printActualSales(){

 document.getElementById('print').innerHTML=`<div style="font-family:Arial;padding:20px"><h1>${esc(db.settings.company||'GM Collection')}</h1><h2>FAKTİKİ SATIŞ</h2><p>Tarix: ${dateNow()}</p><table class="table" border="1"><tr><th>Kod</th><th>Məhsul</th><th>Ümumi</th><th>Faktiki</th><th>Hesablanan</th><th>Qaimə</th><th>Fərq</th></tr>${rows.map(x=>`<tr><td>${esc(x.p.code)}</td><td>${esc(x.p.name)}</td><td>${x.available}</td><td>${x.actual===''?'':x.actual}</td><td>${x.sold===''?'':x.sold}</td><td>${x.recorded}</td><td>${x.diff===''?'':x.diff}</td></tr>`).join('')}</table></div>`;
 window.print();
}

  p.növ=(document.getElementById('fnov')?.value||'').trim();

  p.unit=(document.getElementById('funit')?.value||'').trim()||'ədəd';
  p.maya=parseFloat(document.getElementById('fmaya')?.value)||0;
  p.cost=parseFloat(document.getElementById('fcost')?.value)||0;
  p.alis=p.cost;
  p.price=parseFloat(document.getElementById('fprice')?.value)||0;
  p.min=parseFloat(document.getElementById('fmin')?.value)||0;
  p.initial=parseFloat(document.getElementById('finit')?.value)||0;

    novInput.value=p.növ||p.nov||'';
    if(dateInput){
      const gd=document.getElementById('ideliveryDate');
      dateInput.value = gd?.value || p.verilmeTarixi || '';
    }
  };

  const closeDropdown = () => {
    dropdown.classList.remove('show');
    dropdown.innerHTML='';
  };

  const openDropdown = (query) => {
    const q = (query||'').trim().toLowerCase();
    let matches;
    if(!q){
      matches = db.products.slice(0,20);
    } else {
      matches = db.products.filter(p => 
        (p.code||'').toLowerCase().includes(q) || 
        (p.name||'').toLowerCase().includes(q)
      ).slice(0,20);
    }
    if(!matches.length){
      dropdown.innerHTML = '<div class="co-empty">Tapılmadı</div>';
      dropdown.classList.add('show');
      return;
    }
    dropdown.innerHTML = matches.map((p,i) => `
      <div class="code-option" data-pid="${p.id}" data-idx="${i}">
        <span class="co-code">${esc(p.code||'')}</span>
        <span class="co-name">${esc(p.name||'')}</span>
      </div>
    `).join('');
    dropdown.classList.add('show');
    dropdown.querySelectorAll('.code-option').forEach(el => {
      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const pid = el.dataset.pid;
        const product = db.products.find(x => x.id === pid);
        if(product){
          codeInput.value = product.code || '';
          fillProduct(product);
          closeDropdown();
        }
      });
    });
  };

  codeInput.addEventListener('input', () => {
    const q = codeInput.value.trim();
    if(!q){
      resetRow();
      openDropdown('');
      return;
    }
    // Tam uyğunluq varsa avtomatik doldur
    const exact = db.products.find(p => (p.code||'').trim().toLowerCase() === q.toLowerCase());
    if(exact){
      fillProduct(exact);
    } else {
      // Yoxsa, sadəcə hidden pid sıfırla (adı silmə, istifadəçi davam edə bilər)
      hiddenPid.value='';
    }
    openDropdown(q);
  });

  codeInput.addEventListener('focus', () => {
    openDropdown(codeInput.value);
  });

  codeInput.addEventListener('blur', () => {
    setTimeout(closeDropdown, 150);
  });

  codeInput.addEventListener('keydown', (e) => {
    const items = dropdown.querySelectorAll('.code-option');
    if(!items.length) return;
    let active = dropdown.querySelector('.code-option.active');
    let idx = active ? +active.dataset.idx : -1;
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      idx = (idx + 1) % items.length;
      items.forEach(it => it.classList.remove('active'));
      items[idx].classList.add('active');
      items[idx].scrollIntoView({block:'nearest'});
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      idx = idx <= 0 ? items.length-1 : idx-1;
      items.forEach(it => it.classList.remove('active'));
      items[idx].classList.add('active');
      items[idx].scrollIntoView({block:'nearest'});
    } else if(e.key === 'Enter'){
      e.preventDefault();
      if(idx >= 0 && items[idx]){
        items[idx].dispatchEvent(new MouseEvent('mousedown'));
      }
    } else if(e.key === 'Escape'){
      closeDropdown();
    }
  });

  if(item){
    const p=prePid?db.products.find(x=>x.id===prePid):null;
    if(p){
      nameInput.value=p.name||preName||'';
      mayaInput.value=item.maya??(p.maya!=null?p.maya:(p.cost||0));
      alisInput.value=item.alis??(p.alis!=null?p.alis:(p.cost||0));
      salePriceInput.value=item.salePrice??(p.price||0);
      novInput.value=item.nov??p.növ??p.nov??'';
      if(dateInput)dateInput.value=item.date||p.verilmeTarixi||'';
    } else if(preCode){
      const exact=db.products.find(x=>(x.code||'').trim().toLowerCase()===preCode.toLowerCase());
      if(exact) fillProduct(exact);
    }
  } else if(preCode){
    const exact=db.products.find(x=>(x.code||'').trim().toLowerCase()===preCode.toLowerCase());
    if(exact) fillProduct(exact);
  }
}

function saveInvoice(type){
  let party=document.getElementById('iparty').value;
  let rows=[...document.querySelectorAll('#invoiceItems .formgrid')];
  let items=[];const existingId=window.__editingInvoiceId||null;
  const globalDate = document.getElementById('ideliveryDate')?.value || '';
  rows.forEach(r=>{
    const code=(r.querySelector('.ii-code')?.value||'').trim();
    const name=(r.querySelector('.ii-name')?.value||'').trim();
    const qty=+r.querySelector('.ii-qty').value||0;
    const maya=+r.querySelector('.ii-maya')?.value||0;
    const alis=+r.querySelector('.ii-alis')?.value||0;
    const salePrice=+r.querySelector('.ii-sale-price')?.value||0;
    const discount=+r.querySelector('.ii-discount').value||0;
    const nov=(r.querySelector('.ii-nov')?.value||'').trim();
    const dateVal = globalDate || (r.querySelector('.ii-date')?.value||'').trim();
    let pid=r.querySelector('.ii-product')?.value||'';
    if(!name||qty<=0)return;
    let product=pid?db.products.find(p=>p.id===pid):null;
    if(!product||product.name!==name){
      product=db.products.find(p=>(p.code||'').toLowerCase()===code.toLowerCase()&&(p.name||'').toLowerCase()===name.toLowerCase());
      if(!product){
        product={id:uid(),code,name,növ:nov,unit:'ədəd',maya,cost:alis,alis,price:salePrice,min:0,initial:0,verilmeTarixi:dateVal};
        db.products.push(product);
      }
    }
    product.maya=maya;product.cost=alis;product.alis=alis;product.price=salePrice;
    product.növ=nov||product.növ||'';if(dateVal)product.verilmeTarixi=dateVal;
    const priceForInvoice=type==='purchase'?alis:salePrice;
    items.push({productId:product.id,code,name,qty,maya,alis,salePrice,price:priceForInvoice,discount,vat:0,nov,date:dateVal});
  });
  if(!items.length){toast('Ən azı bir sətir','bad');return;}
  let p=(type==='sale'?db.customers:db.suppliers).find(x=>x.id===party);
  if(existingId){
    const inv=db.invoices.find(x=>x.id===existingId);
    if(inv){
      (inv.items||[]).forEach(x=>logStock(x.productId,(inv.type==='purchase'?-1:1)*x.qty,'invoice-edit-revert',inv.id,inv.no));
      inv.no=document.getElementById('ino').value;inv.date=document.getElementById('idate').value;
      inv.deliveryDate = globalDate;
      inv.type=type;inv.partyId=party;inv.partyName=p?.name||'';inv.items=items;
      items.forEach(x=>logStock(x.productId,(type==='purchase'?1:-1)*x.qty,'invoice-edit',inv.id,inv.no));
    }
    window.__editingInvoiceId=null;closeModal();save();toast('Qaimə düzəldildi');
  } else {
    const no=document.getElementById('ino').value;
    const newInv={id:uid(),no,date:document.getElementById('idate').value,deliveryDate:globalDate,type,partyId:party,partyName:p?.name||'',items};
    db.invoices.push(newInv);
    items.forEach(x=>logStock(x.productId,(type==='purchase'?1:-1)*x.qty,'invoice',newInv.id,no));
    closeModal();save();toast('Qaimə yadda saxlanıldı');
  }
}

function importProductsExcel(input){
  if(typeof XLSX==='undefined'){toast('Excel kitabxanası yoxdur','bad');input.value='';return;}
  var file=input.files&&input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:'array'});
      var sheet=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
      if(!rows.length){toast('Fayl boşdur','bad');input.value='';return;}
      var headerRow=0;
      for(var i=0;i<Math.min(10,rows.length);i++){
        var r=rows[i].map(c=>String(c).toLowerCase().trim());
        if(r.some(c=>c.indexOf('kod')>=0||c.indexOf('məhsul')>=0||c.indexOf('mehsul')>=0||c.indexOf('ad')>=0)){headerRow=i;break;}
      }
      var headers=rows[headerRow].map(h=>String(h).toLowerCase().trim());
      function col(names){for(var n=0;n<names.length;n++){for(var h=0;h<headers.length;h++){if(headers[h].indexOf(names[n])>=0)return h;}}return -1;}
      var iCode=col(['kod','code']),iName=col(['məhsul','mehsul','ad','name']),iNov=col(['növ','nov','tip','kateqoriya']),
          iUnit=col(['vahid','unit']),iMaya=col(['maya']),iCost=col(['alış','alis','cost']),iPrice=col(['satış','satis','price']),
          iMin=col(['minimum','min']),iInit=col(['başlanğıc','baslangic','ilkin','initial','stok']),iDate=col(['verilmə','verilme','tarix','date']);
      var added=0,skipped=0;
      for(var r=headerRow+1;r<rows.length;r++){
        var row=rows[r];if(!row||!row.length)continue;
        var name=iName>=0?String(row[iName]||'').trim():'';
        var code=iCode>=0?String(row[iCode]||'').trim():'';
        if(!name&&!code){skipped++;continue;}
        var costVal=iCost>=0?(parseFloat(row[iCost])||0):0;
        var newP={id:uid(),code,name:name||code,növ:iNov>=0?String(row[iNov]||'').trim():'',
          unit:iUnit>=0?(String(row[iUnit]||'').trim()||'ədəd'):'ədəd',
          maya:iMaya>=0?(parseFloat(row[iMaya])||0):0,cost:costVal,alis:costVal,
          price:iPrice>=0?(parseFloat(row[iPrice])||0):0,min:iMin>=0?(parseFloat(row[iMin])||0):0,
          initial:iInit>=0?(parseFloat(row[iInit])||0):0,verilmeTarixi:iDate>=0?String(row[iDate]||'').trim():''};
        db.products.push(newP);
        if(newP.initial!==0) logStock(newP.id,newP.initial,'import','','Excel idxal');
        added++;
      }
      save();input.value='';toast(added+' məhsul əlavə olundu');
    }catch(err){console.error(err);input.value='';toast('Excel oxunmadı: '+err.message,'bad');}
  };
  reader.readAsArrayBuffer(file);
}

    categories:candidate.categories||[],returns:candidate.returns||[],
    settings:candidate.settings||{company:'BiznesPro',currency:'AZN'}
   };
   migrate();
   localStorage.setItem(KEY,JSON.stringify(db));input.value='';render();toast('Bərpa edildi');
  }catch(err){input.value='';toast('Fayl düzgün deyil','bad');}
 };
 r.readAsText(f);
}
function migrate(){
  (db.products||[]).forEach(p=>{
    if(p.maya==null)p.maya=0;
    if(p.alis==null)p.alis=Number(p.cost||0);
    if(p.cost==null)p.cost=Number(p.alis||0);
    if(p.verilmeTarixi==null)p.verilmeTarixi='';
  });
  (db.invoices||[]).forEach(inv=>(inv.items||[]).forEach(item=>{
    const p=db.products.find(x=>x.id===item.productId);
    if(item.maya==null)item.maya=p?.maya??0;
    if(item.alis==null)item.alis=p?.alis??p?.cost??0;
    if(item.salePrice==null)item.salePrice=p?.price??item.price??0;
    if(item.date==null)item.date='';
  }));
}

function openSearch(){
  document.getElementById('searchOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('globalSearchInput').focus(),50);
}
function closeSearch(){document.getElementById('searchOverlay').classList.remove('show');document.getElementById('searchResults').innerHTML='';}
function runSearch(q){
  q=(q||'').toLowerCase().trim();
  const box=document.getElementById('searchResults');
  if(!q){box.innerHTML='';return;}
  const out=[];
  db.products.forEach(p=>{
    if(((p.name||'')+' '+(p.code||'')).toLowerCase().includes(q)){
      out.push({t:'📦 '+esc(p.code||'')+' — '+esc(p.name),s:'Məhsul • Qalıq: '+stock(p),fn:`go('products')`});
    }
  });
  db.customers.forEach(c=>{
    if(((c.name||'')+' '+(c.phone||'')+' '+(c.code||'')).toLowerCase().includes(q))
      out.push({t:'👤 '+esc(c.name),s:'Müştəri • '+esc(c.phone||''),fn:`go('customers')`});
  });
  db.suppliers.forEach(s=>{
    if(((s.name||'')+' '+(s.phone||'')+' '+(s.code||'')).toLowerCase().includes(q))
      out.push({t:'🚚 '+esc(s.name),s:'Təchizatçı • '+esc(s.phone||''),fn:`go('suppliers')`});
  });
  db.invoices.forEach(i=>{
    if(((i.no||'')+' '+(i.partyName||'')).toLowerCase().includes(q))
      out.push({t:'🧾 '+esc(i.no)+' — '+esc(i.partyName||''),s:'Qaimə • '+i.date+' • '+money(invTotal(i)),fn:`go('invoices')`});
  });
  box.innerHTML=out.slice(0,30).map((r,idx)=>`<div class="search-item" onclick="closeSearch();${r.fn}"><div class="tt">${r.t}</div><div class="ss">${r.s}</div></div>`).join('')||'<p class="muted" style="padding:14px">Nəticə yoxdur</p>';
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}
  if(e.key==='Escape')closeSearch();
});
document.getElementById('searchOverlay').addEventListener('click',e=>{if(e.target.id==='searchOverlay')closeSearch()});

  let t=paytype.value;
  let a=t==='customer'?db.customers:db.suppliers;

  if(!p){toast('Tərəf yoxdur','bad');return}

  if(editingId){
    const existing = db.payments.find(x=>x.id===editingId);
    if(existing){
      existing.date = paydate.value;
      existing.type = t;
      existing.partyId = p.id;
      existing.partyName = p.name;
      existing.amount = +payamount.value||0;
      existing.method = paymethod.value;
    }
    window.__editingPaymentId = null;
    closeModal();save();toast('Ödəniş düzəldildi');
  } else {
    db.payments.push({
      id:uid(),date:paydate.value,type:t,partyId:p.id,
      partyName:p.name,amount:+payamount.value||0,method:paymethod.value
    });
    closeModal();save();toast('Ödəniş saxlanıldı');
  }

(function killNetlifyBanner(){
  function clean(){
    // Bütün iframe-ləri sil
    const iframes = document.querySelectorAll('iframe');
    iframes.forEach(el => {
      const src = (el.src || '').toLowerCase();
      const id = (el.id || '').toLowerCase();
      if(src.includes('netlify') || id.includes('netlify')){
        el.remove();
      }
    });
    // Bütün iframe-ləri sil (aqressiv fallback)
    document.querySelectorAll('iframe').forEach(el => el.remove());
    
    // Netlify badge
    const badge = document.getElementById('nl-badge');
    if(badge){
      let target = badge;
      for(let i = 0; i < 5; i++){
        if(target.parentElement && target.parentElement !== document.body){
          target = target.parentElement;
        }
      }
      target.remove();
    }
    
    // Netlify class elementləri
    document.querySelectorAll('[class*="nl-badge"], [class*="netlify"], [id*="netlify"]').forEach(el => el.remove());
  }
  
  clean();
  setTimeout(clean, 100);
  setTimeout(clean, 500);
  setTimeout(clean, 1000);
  setTimeout(clean, 2000);
  setTimeout(clean, 5000);
  setInterval(clean, 1000);
})();

// ============ BARKOD SKANER ============
let html5QrCode = null;

function openBarcodeScanner(){
  document.getElementById('barcodeModal').classList.add('show');
  
  setTimeout(() => {
    if(typeof Html5Qrcode === 'undefined'){
      alert('Kamera kitabxanası yüklənmədi.');
      return;
    }
    
    invoiceScanner = new Html5Qrcode("barcodeModalReader");
    invoiceScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 150 } },
      (decodedText) => {
        const product = db.products.find(p => (p.code || '').toString() === decodedText.toString());
        if(product){
          closeBarcodeModal();
          go('products');
          setTimeout(() => {
            const ps = document.getElementById('ps');
            if(ps){ ps.value = product.code; filterProducts(); }
            toast('✅ Tapıldı: ' + product.name);
          }, 300);
        } else {
          toast('❌ Tapılmadı: ' + decodedText, 'bad');
        }
      },
      (err) => {}
    ).catch(err => alert('Kamera xətası: ' + err));
  }, 300);
}

// ============ QAİMƏ ÜÇÜN BARKOD SKANER ============
let invoiceScanner = null;
let invoiceScannerRowIndex = -1;

function scanForInvoice(btn){
  const allRows = [...document.querySelectorAll('#invoiceItems .formgrid')];
  invoiceScannerRowIndex = allRows.indexOf(btn.closest('.formgrid'));
  document.getElementById('barcodeModal').classList.add('show');
  
  setTimeout(() => {
    invoiceScanner = new Html5Qrcode("barcodeModalReader");
    invoiceScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 150 } },
      (decodedText) => {
        const product = db.products.find(p => (p.code || '').toString() === decodedText.toString());
        if(product){
          const allRows = [...document.querySelectorAll('#invoiceItems .formgrid')];
          const targetRow = allRows[invoiceScannerRowIndex];
          if(targetRow){
            targetRow.querySelector('.ii-code').value = product.code || '';
            targetRow.querySelector('.ii-name').value = product.name || '';
            targetRow.querySelector('.ii-maya').value = product.maya != null ? product.maya : (product.cost || 0);
            targetRow.querySelector('.ii-alis').value = product.alis != null ? product.alis : (product.cost || 0);
            targetRow.querySelector('.ii-sale-price').value = product.price || 0;
            targetRow.querySelector('.ii-nov').value = product.növ || product.nov || '';
            targetRow.querySelector('.ii-product').value = product.id;
          }
          toast('✅ ' + product.name);
          closeBarcodeModal();
        } else {
          toast('❌ Tapılmadı', 'bad');
        }
      },
      (err) => {}
    );
  }, 300);
}

function closeBarcodeModal(){
  if(invoiceScanner){
    invoiceScanner.stop().then(() => {
      invoiceScanner.clear();
      invoiceScanner = null;
    });
  }
  document.getElementById('barcodeModal').classList.remove('show');
  invoiceScannerRowIndex = -1;
}
